  <body class="bg-[#0D0D0D] text-white antialiased selection:bg-[#FF243D]/30 selection:text-white">
    <div id="root"></div>
    
    <script>
      (function () {
        var isRootDevHtml = !!document.querySelector('script[src="/src/main.tsx"]');
        var isFileProtocol = window.location.protocol === 'file:';
        function renderFallbackNotice() {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          if (isRootDevHtml) {
            window.location.replace('./dist/index.html');
            return;
          }
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0D0D0D;color:#FFFFFF;font-family:system-ui,-apple-system,sans-serif;">' +
              '<div style="max-width:560px;width:100%;background:#151515;border:1px solid #B00020;border-radius:16px;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,0.6);">' +
                '<div style="color:#FF243D;font-size:12px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:8px;">CarbControl — Sukuna Edition</div>' +
                '<h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;">Não foi possível carregar o aplicativo</h1>' +
                '<p style="margin:0 0 16px;color:#B5B5B5;font-size:14px;line-height:1.6;">' +
                  'Verifique se a pasta <code>assets/</code> está no mesmo diretório que este <code>index.html</code> ou rode <code>npx serve dist</code>.' +
                '</p>' +
              '</div>' +
            '</div>';
        }
        window.setTimeout(renderFallbackNotice, isFileProtocol ? 800 : 2500);
      })();
    </script>
  </body>
